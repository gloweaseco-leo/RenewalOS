name: RenewalOS G1-G release & recovery gate CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renewalos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d renewalos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RENEWAL_PG_MIGRATION_DSN: postgresql://postgres:postgres@127.0.0.1:5432/renewalos_ci
      RENEWAL_PG_TEST_DSN: postgresql://renewalos_ci_app:g1b-ci-test-password@127.0.0.1:5432/renewalos_ci
      RENEWAL_PG_CI_BOOTSTRAP: I_ACCEPT_CI_ONLY
      RENEWAL_PG_AUTH_DSN: postgresql://renewalos_ci_auth:g1e-ci-auth-test-only@127.0.0.1:5432/renewalos_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e '.[test,postgres]'
      - name: Apply PostgreSQL migration to disposable DB
        run: python -m scripts.pg_apply --confirm-new-database
      - name: Provision isolated CI role
        run: python -m scripts.pg_ci_bootstrap
      - name: Apply G1-C restricted business migration
        run: python -m scripts.pg_apply_g1c --confirm-test-database
      - name: Apply G1-E identity migration
        run: python -m scripts.pg_apply_g1e
      - name: Provision dedicated identity role
        run: python -m scripts.pg_ci_auth_roles
      - name: Apply G1-H local OIDC security migration
        run: python -m scripts.pg_apply_g1h
      - name: Execute SQLite and PostgreSQL regression tests
        run: python -m pytest -q
      - name: Run real TCP HTTP business E2E
        run: python -m scripts.http_e2e_g1e
      - name: Install Chromium for real browser acceptance
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: G1-F real Chromium HTTP / PostgreSQL user journey
        if: matrix.python-version == '3.11'
        run: python -m scripts.browser_http_e2e_g1f
      - name: Upload synthetic-only browser screenshot on failure
        if: failure() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: g1f-browser-failure
          path: browser_artifacts/failure.png
          if-no-files-found: ignore
          retention-days: 3
      - name: G1-G local release NO-GO audit
        run: |
          RENEWAL_RUNTIME_MODE=secure_local RENEWAL_AUTH_BACKEND=postgres \
          RENEWAL_PG_APP_DSN="$RENEWAL_PG_TEST_DSN" \
          python -m scripts.release_audit_g1g
      - name: G1-G disposable PostgreSQL backup and restore rehearsal
        if: matrix.python-version == '3.11'
        run: python -m scripts.backup_restore_g1g
      - name: Validate browser JS syntax
        run: |
          node --check static/app.js
          node --check static/secure.js
