[project]
name = "renewalos-mvp"
version = "0.5.0"
description = "Independent local demo for sports training renewal opportunities"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
