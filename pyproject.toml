[project]
name = "renewalos-mvp"
version = "1.0.0b7"
description = "Independent local demo for sports training renewal opportunities"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "httpx>=0.27,<1.0", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["renewalos"]
